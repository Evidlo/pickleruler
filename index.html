<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pickleruler</title>
<style>
  :root {
    --bg: #1a1a1a; --panel: #111111; --fg: #e8e8e8; --head: #6f8599; --key: #ffd866; --dim: #a8b4c0;
    --msg: #8fd18f; --btn: #262626; --btn-hover: #333333; --btn-on: #4a4a1a; --sep: #333333;
    --title: #2b2b2b; --sel: #00e5ff; --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 12px/1.4 var(--mono); }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; display: block; }
  #cv.nocursor { cursor: none; }
  #video { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #hud { position: fixed; left: 16px; top: 16px; background: var(--panel); border: 1px solid #555;
    box-shadow: 0 4px 18px #0008; user-select: none; max-width: calc(100vw - 32px); }
  #title { background: var(--title); padding: 3px 8px; cursor: move; color: #ddd; white-space: nowrap; }
  #title b { color: #fff; }
  .bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; }
  .bar button { background: var(--btn); color: var(--fg); border: 0; font: inherit; padding: 2px 7px 2px 5px;
    cursor: pointer; }
  .bar button:hover { background: var(--btn-hover); }
  .bar button.on { background: var(--btn-on); }
  .bar button:disabled { opacity: .45; cursor: default; }
  kbd { font: inherit; font-weight: bold; color: var(--key); }
  .sep { height: 1px; background: var(--sep); }
  .rich { padding: 4px 8px; white-space: pre; overflow-x: auto; user-select: text; cursor: text; }
  #info { min-width: 84ch; }
  .h { color: var(--head); } .dim { color: var(--dim); } .msg { color: var(--msg); }
  .sw { display: inline-block; width: 1.6em; height: 1em; vertical-align: -2px; border: 1px solid #555; }
  #calbox { position: fixed; background: var(--panel); border: 1px solid var(--sel); padding: 4px 6px;
    box-shadow: 0 4px 14px #000a; transform: translate(-50%, calc(-100% - 16px)); min-width: 26ch; }
  #calbox.below { transform: translate(-50%, 16px); }
  #clabel { color: var(--sel); font-weight: bold; }
  #clabel.err { color: #ff5c5c; }
  #cinput { display: block; width: 100%; box-sizing: border-box; background: #000; color: #fff; border: 0;
    font: inherit; padding: 2px 4px; margin: 3px 0; outline: none; }
  #cinput::placeholder { color: var(--head); }
  #chint { color: var(--head); white-space: nowrap; }
  #welcome { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #welcome div { text-align: center; line-height: 2; color: var(--dim); font-size: 14px; }
  #welcome h1 { color: var(--fg); font-size: 22px; margin: 0 0 8px; }
  #welcome code { color: var(--fg); }
  #welcome .warn { color: #ff8a80; }
  .stories { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 28px; }
  .stories figure { margin: 0; }
  .stories .shot { width: 300px; height: 200px; border: 1px solid #333; display: block; }
  .stories div.shot { display: grid; place-items: center; border-style: dashed; border-color: #555;
    color: #555; font-size: 12px; }
  .stories figcaption { color: var(--fg); margin-top: 6px; line-height: 1.4; }
  body.dragover #cv { outline: 3px dashed var(--key); outline-offset: -8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<video id="video" muted playsinline></video>
<input id="file" type="file" accept="image/*" hidden>

<div id="welcome">

<script>
'use strict';

const VERSION = '0.0.6';
const NEED = { line: 2, axis: 2, angle: 3, circle: 2, pt: 1, poly: 0, path: 0 };
const TOOLS = [
  ['pan', 'v', 'Pan'], ['line', 'l', 'Line'], ['angle', 'p', 'Protractor'], ['poly', 'a', 'Area'],
  ['path', 't', 'Path'], ['circle', 'o', 'Circle'], ['digitize', 'd', 'Digitize'],
];
const HINTS = {
  pan: 'drag handle: reshape · drag edge: move it · drag inside area/circle: move all · {c} calibrates',
  line: 'click-click or drag · {Shift} snaps 45° · {c} calibrates start/end values',
  angle: 'click arm end, vertex, other arm end',
  poly: 'click vertices · {right-click}/{Enter}/{double-click} closes · {c} calibrates known area',
  path: 'click vertices · {right-click}/{Enter}/{double-click} ends · {c} calibrates start/end values',
  circle: 'click centre, then a point on the edge · {c} calibrates centre/edge values',
};
const HELP = [
  ['tools', '{v} pan/select  {l} line  {p} protractor  {a} area  {t} path  {o} circle  {d} digitize'],
  ['mouse', 'wheel zoom · left-drag pans (pan tool) · middle-drag pans (any tool)'],
  ['', '{Shift} snaps 45° · {right-click}/{Enter}/{double-click} finishes area/path'],
  ['calib', '{c}/{right-click} calibrate step by step at the point · {Enter} next · {Esc} cancel'],
  ['', 'blank value → back to pixels · {Backspace} on empty field → previous step'],
  ['', 'line/path: start, end, units · circle: + clockwise? · axis: + log scale?'],
  ['', 'area: known area, units (holds when the area is resized)'],
  ['hover', 'line: value · path: distance along · circle: angle from centre→edge, radius'],
  ['edit', 'pan tool: drag handle reshapes · drag edge moves it · drag inside area/circle moves all'],
  ['', '{Del} delete · {u} undo'],
  ['view', '{m} loupe · {x} crosshair · {r} reset view · {h} hide panel · {?} help'],
  ['source', '{w} capture window · {f} live on/off · {Ctrl+V} paste · {i} open · drop a file'],
  ['output', '{y} copy readout · {Y} copy points CSV · {E} copy report · {P} save PNG · {Esc} back'],
];
const CAL_KINDS = ['line', 'axis', 'path', 'circle'];
const COL = { shape: '#ffd400', sel: '#00e5ff', preview: '#ff4fd8', axis: '#7cfc00', pt: '#ff5c5c',
              cross: '#b0b0b0', value: '#ffffff', hot: '#ffffff' };
const FONT = '12px ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';
const HIT = 8, LOUPE_N = 15, LOUPE_MAG = 10;

// ---------------------------------------------------------------- geometry
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const lerp = (a, b, t) => [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
const clamp01 = t => Math.min(1, Math.max(0, t));
const mod = (a, n) => ((a % n) + n) % n;
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;

function segParam(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  return ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / Math.max(dx * dx + dy * dy, 1e-12);
}
const segDist = (p, a, b) => dist(p, lerp(a, b, clamp01(segParam(p, a, b))));

function snap45(anchor, p) {
  const dx = p[0] - anchor[0], dy = p[1] - anchor[1];
  const ang = Math.atan2(dy, dx), q = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
  const L = Math.hypot(dx, dy) * Math.cos(ang - q);
  return [anchor[0] + L * Math.cos(q), anchor[1] + L * Math.sin(q)];
}

// direction a->b in degrees, counter-clockwise with y up
const heading = (a, b) => deg(Math.atan2(a[1] - b[1], b[0] - a[0]));

const polyLen = pts => pts.slice(1).reduce((acc, p, i) => acc + dist(pts[i], p), 0);

function polyFoot(pts, p) {
  let best = null, s0 = 0;
  for (let i = 0; i + 1 < pts.length; i++) {
    const a = pts[i], b = pts[i + 1], t = clamp01(segParam(p, a, b)), f = lerp(a, b, t);
    const cand = [dist(p, f), f, s0 + t * dist(a, b)];
    best = !best || cand[0] < best[0] ? cand : best;
    s0 += dist(a, b);
  }
  return best;
}

function insidePolygon([x, y], pts) {
  let inside = false;
  pts.forEach(([x0, y0], i) => {
    const [x1, y1] = pts[(i + 1) % pts.length];
    if ((y0 > y) !== (y1 > y) && x < x0 + (y - y0) * (x1 - x0) / (y1 - y0)) inside = !inside;
  });
  return inside;
}

const shoelace = pts => Math.abs(pts.reduce((acc, [x0, y0], i) => {
  const [x1, y1] = pts[(i + 1) % pts.length];
  return acc + x0 * y1 - x1 * y0;
}, 0)) / 2;

function angleExtent(pts) {
  const [a, v, b] = pts, start = heading(v, a);
  return [start, mod(heading(v, b) - start + 180, 360) - 180];
}

const fmt = v => String(Number(v.toPrecision(6)));
const f1 = v => v.toFixed(1);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ------------------------------------------------------------- calibration
// (key, prompt) for each step of the calibration dialogue
function calSteps(kind) {
  if (kind === 'poly') return [['area', 'known area'], ['unit', 'units']];
  const [a, b] = kind === 'circle' ? ['centre', 'edge'] : ['point 1', 'point 2'];
  const extra = { axis: [['log', 'log scale?']], circle: [['cw', 'clockwise?']] }[kind] || [];
  return [['v0', `calibrate ${a}`], ['v1', `calibrate ${b}`], ['unit', 'units'], ...extra];
}

const KEEP = 'keep';

// previous yes/no answers, shown greyed in the dialogue
const calPrevious = s => Object.fromEntries(['log', 'cw'].map(k => [k, s.cal && s.cal[k] ? 'yes' : 'no']));

// parse one step's answer; null: clear the calibration, KEEP: blank point 2, keep the image scale
function calAnswer(key, text, answers, prev, kind, scaled) {
  if (key === 'v1' && !text && kind !== 'axis' && scaled) return KEEP;
  if (key === 'v1' && !text) throw new Error('needs a value (no scale set yet)');
  if (['v0', 'v1', 'area'].includes(key)) {
    if (!text) return null;
    const v = Number(text);
    if (isNaN(v)) throw new Error('not a number');
    if (key === 'v1' && v === answers.v0) throw new Error('must differ from the first value');
    if (key === 'area' && v <= 0) throw new Error('area must be positive');
    return v;
  }
  if (key === 'unit') return text.replace(/(\^2|²)$/, '');
  const t = (text || prev[key] || 'no').toLowerCase();
  if (!['y', 'yes', 'n', 'no'].includes(t)) throw new Error('answer yes or no');
  const yes = t[0] === 'y';
  if (key === 'log' && yes && Math.min(answers.v0, answers.v1) <= 0) throw new Error('log scale needs positive values');
  return yes;
}

// length that a shape's end value sits at: radius for circles, path length otherwise
const spanPx = s => (s.kind === 'circle' ? dist(s.pts[0], s.pts[1]) : polyLen(s.pts));

const calStr = cal =>
  `${fmt(cal.v0)} → ${fmt(cal.v1)}${cal.log ? ' log' : ''}${cal.cw ? ' cw' : ''} ${cal.unit}`.trimEnd();

function calValue(cal, t) {
  if (cal.log) {
    const l0 = Math.log10(cal.v0), l1 = Math.log10(cal.v1);
    return 10 ** (l0 + t * (l1 - l0));
  }
  return cal.v0 + t * (cal.v1 - cal.v0);
}

// ------------------------------------------------------------------- state
const $ = s => document.querySelector(s);
const cv = $('#cv'), video = $('#video');
const src = document.createElement('canvas');
const sctx = src.getContext('2d', { willReadFrequently: true });
const loupeCanvas = Object.assign(document.createElement('canvas'), { width: LOUPE_N, height: LOUPE_N });
const lctx = loupeCanvas.getContext('2d');
let g = cv.getContext('2d');
let V = { z: 1, tx: 0, ty: 0 };
let W = 0, H = 0, dpr = 1;
const S = {
  has: false, source: '', shapes: [], cur: null, sel: null, scaleK: null, scaleSrc: null,
  mouse: [-1e4, -1e4], mouseIn: false, shift: false, drag: null, press: null,
  hover: null, preview: null, loupe: true, cross: true, calflow: null, msg: '', tool: 'line',
  stream: null, live: false, viewTouched: false,
};

const c = p => [p[0] * V.z + V.tx, p[1] * V.z + V.ty];
const im = (x, y) => [(x - V.tx) / V.z, (y - V.ty) / V.z];
const snapped = (p, anchor) => (S.shift && anchor ? snap45(anchor, p) : p);
const cursorPoint = () => snapped(im(...S.mouse), S.cur ? S.cur.pts.at(-1) : null);

// ---------------------------------------------------------------- measures
// [units per px, unit] for the whole image, or null
const scale = () => S.scaleK;

// fix the image scale from shape s having known length (or area, for polygons) `value`
function setScale(s, value, unit) {
  const k = s.kind === 'poly' ? Math.sqrt(value / Math.max(shoelace(s.pts), 1e-12)) : value / Math.max(spanPx(s), 1e-12);
  S.scaleK = [k, unit];
  S.scaleSrc = s;
}

const unit = () => (S.scaleK ? S.scaleK[1] : 'px');

// value at px along a line/path (or radius of a circle): its start offset plus scaled distance
function alongValue(s, px) {
  const cal = s.cal || { v0: 0, dir: 1 };
  return cal.v0 + cal.dir * px * (S.scaleK ? S.scaleK[0] : 1);
}

function fmtLen(px) {
  const sc = scale();
  return sc ? `${fmt(px * sc[0])} ${sc[1]}`.trimEnd() : `${f1(px)} px`;
}

function fmtArea(px2) {
  const sc = scale();
  if (!sc) return `${f1(px2)} px²`;
  return sc[1] ? `${fmt(px2 * sc[0] ** 2)} ${sc[1]}²` : fmt(px2 * sc[0] ** 2);
}

function axes() {
  const ax = {};
  S.shapes.filter(s => s.kind === 'axis' && s.cal).forEach(s => { ax[s.axis] = s; });
  return [ax.x || null, ax.y || null];
}

function toData(p) {
  const [X, Y] = axes();
  if (!X || !Y) return null;
  const dX = [X.pts[1][0] - X.pts[0][0], X.pts[1][1] - X.pts[0][1]];
  const dY = [Y.pts[1][0] - Y.pts[0][0], Y.pts[1][1] - Y.pts[0][1]];
  const det = dX[0] * dY[1] - dX[1] * dY[0];
  if (Math.abs(det) < 1e-9) return null;
  const solve = o => {
    const rx = p[0] - o[0], ry = p[1] - o[1];
    return [(rx * dY[1] - ry * dY[0]) / det, (dX[0] * ry - dX[1] * rx) / det];
  };
  return [calValue(X.cal, solve(X.pts[0])[0]), calValue(Y.cal, solve(Y.pts[0])[1])];
}

function indexOf(s) {
  const same = S.shapes.filter(x => x.kind === s.kind), i = same.indexOf(s);
  return i >= 0 ? i + 1 : same.length + 1;
}
const name = s => (s.kind === 'axis' ? `${s.axis.toUpperCase()}-axis` : `${s.kind} ${indexOf(s)}`);

function calTag(s) {
  const k = s.kind, cal = s.cal;
  if (k === 'axis') return cal ? `  [${calStr(cal)}]` : '';
  if (!cal || !CAL_KINDS.includes(k)) return '';
  return `  [${fmt(cal.v0)} → ${fmt(alongValue(s, spanPx(s)))}${cal.cw ? ' cw' : ''} ${unit()}`.trimEnd() + ']';
}

function summary(s) {
  const k = s.kind, pts = s.pts, L = fmtLen, tag = calTag(s);
  if (k === 'line' || k === 'axis' || (k === 'angle' && pts.length < 3)) {
    const [a, b] = pts;
    return `L=${L(dist(a, b))}  Δx=${L(b[0] - a[0])}  Δy=${L(a[1] - b[1])}  θ=${heading(a, b).toFixed(2)}°` + tag;
  }
  if (k === 'angle') {
    const ang = Math.abs(angleExtent(pts)[1]);
    return `${ang.toFixed(3)}°  (reflex ${(360 - ang).toFixed(3)}°)`;
  }
  if (k === 'poly' && pts.length >= 3) {
    return `A=${fmtArea(shoelace(pts))}  P=${L(polyLen([...pts, pts[0]]))}  n=${pts.length}` + tag;
  }
  if (k === 'path' || k === 'poly') return `L=${L(polyLen(pts))}  segments=${pts.length - 1}` + tag;
  if (k === 'circle') {
    const r = dist(pts[0], pts[1]);
    return `r=${L(r)}  d=${L(2 * r)}  A=${fmtArea(Math.PI * r * r)}  C=${L(2 * Math.PI * r)}`
      + `  θ₀=${heading(pts[0], pts[1]).toFixed(2)}°` + tag;
  }
  const d = toData(pts[0]), px = `px ${f1(pts[0][0])}, ${f1(pts[0][1])}`;
  return d ? `x=${fmt(d[0])}  y=${fmt(d[1])}  (${px})` : px;
}

function shortLabel(s) {
  const k = s.kind, pts = s.pts, ref = s === S.scaleSrc ? ' (ref)' : '';
  if (k === 'line') return fmtLen(dist(pts[0], pts[1])) + ref;
  if (k === 'axis') return s.axis.toUpperCase() + (s.cal ? '' : ' (not calibrated: c)');
  if (k === 'angle') return pts.length === 3 ? `${Math.abs(angleExtent(pts)[1]).toFixed(2)}°` : fmtLen(dist(pts[0], pts[1]));
  if (k === 'poly' && pts.length >= 3) return fmtArea(shoelace(pts)) + ref;
  if (k === 'path' || k === 'poly') return fmtLen(polyLen(pts)) + ref;
  if (k === 'circle') return 'r=' + fmtLen(dist(pts[0], pts[1])) + ref;
  return `#${indexOf(s)}`;
}

function shapeDist(s, p) {
  const pts = s.pts;
  if (s.kind === 'circle') return Math.abs(dist(pts[0], p) - dist(pts[0], pts[1]));
  if (s.kind === 'pt') return dist(pts[0], p);
  const segs = pts.slice(1).map((b, i) => [pts[i], b]);
  if (s.kind === 'poly') segs.push([pts.at(-1), pts[0]]);
  return Math.min(...segs.map(([a, b]) => segDist(p, a, b)));
}

function nearest(x, y) {
  const p = im(x, y);
  let best = null;
  for (const s of S.shapes) {
    const d = shapeDist(s, p) * V.z;
    if (d <= HIT && (!best || d < best[0])) best = [d, s];
  }
  return best ? best[1] : null;
}

function hitHandle(x, y) {
  const order = [...(S.shapes.includes(S.sel) ? [S.sel] : []), ...S.shapes.slice().reverse()];
  for (const s of order) {
    for (let k = 0; k < s.pts.length; k++) {
      const [cx, cy] = c(s.pts[k]);
      if (Math.hypot(cx - x, cy - y) <= HIT) return [s, k];
    }
  }
  return null;
}

// part of a shape to move from canvas (x, y): [shape, point indices] or null.
// segments move their own two points (a protractor moves whole); area/circle interiors move whole.
function hitBody(x, y) {
  const p = im(x, y), tol = HIT / V.z;
  const order = [...(S.shapes.includes(S.sel) ? [S.sel] : []), ...S.shapes.slice().reverse()];
  const all = s => s.pts.map((_, i) => i);
  for (const s of order) {
    const k = s.kind, pts = s.pts, n = pts.length;
    if (!['line', 'axis', 'path', 'poly', 'angle'].includes(k)) continue;
    const segs = [...Array(k === 'poly' ? n : n - 1).keys()].map(i => [i, (i + 1) % n]);
    const [d, ij] = segs.map(([i, j]) => [segDist(p, pts[i], pts[j]), [i, j]]).reduce((a, b) => (b[0] < a[0] ? b : a));
    if (d <= tol) return [s, k === 'angle' ? all(s) : ij];
  }
  for (const s of order) {
    const pts = s.pts;
    if ((s.kind === 'poly' && insidePolygon(p, pts))
        || (s.kind === 'circle' && dist(pts[0], p) <= dist(pts[0], pts[1]) + tol)) return [s, all(s)];
  }
  return null;
}

function hoverInfo(s, p) {
  const pts = s.pts, cal = s.cal;
  if (s.kind === 'circle') {
    const ctr = pts[0], R = Math.max(dist(pts[0], pts[1]), 1e-12), r = dist(ctr, p);
    const edge = Math.abs(r - R) * V.z;
    if (r > R && edge > HIT) return null;
    const theta = mod((heading(ctr, p) - heading(pts[0], pts[1])) * (cal && cal.cw ? -1 : 1), 360);
    const val = alongValue(s, r);
    const radial = cal ? `${fmt(val)} ${unit()}` : `r=${fmtLen(r)}`;
    return {
      d: Math.min(edge, HIT), shape: s, foot: p, text: `θ=${theta.toFixed(2)}°  ${radial}`,
      copy: `${fmt(val)}, ${theta.toFixed(3)}`,
    };
  }
  const [d, foot, along] = polyFoot(pts, p);
  if (d * V.z > HIT) return null;
  if (s.kind === 'axis') {
    const val = cal ? calValue(cal, along / Math.max(polyLen(pts), 1e-12)) : null;
    const text = cal ? `${fmt(val)} ${cal.unit}`.trimEnd() : fmtLen(along);
    return { d: d * V.z, shape: s, foot, text, copy: cal ? fmt(val) : text };
  }
  const val = alongValue(s, along);
  return { d: d * V.z, shape: s, foot, text: cal ? `${fmt(val)} ${unit()}` : fmtLen(along), copy: fmt(val) };
}

function findHover() {
  if (S.cur || S.calflow || !S.mouseIn) return null;
  const p = im(...S.mouse);
  const cands = S.shapes.filter(s => CAL_KINDS.includes(s.kind)).map(s => hoverInfo(s, p)).filter(Boolean);
  return cands.length ? cands.reduce((a, b) => (b.d < a.d ? b : a)) : null;
}

// ----------------------------------------------------------------- drawing
let queued = false;
function redraw() {
  if (!queued) { queued = true; requestAnimationFrame(render); }
}

function render() {
  queued = false;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#1a1a1a';
  g.fillRect(0, 0, W, H);
  if (S.has) {
    g.imageSmoothingEnabled = V.z < 1;
    g.drawImage(src, V.tx, V.ty, src.width * V.z, src.height * V.z);
  }
  S.shapes.forEach(s => drawShape(s));
  if (S.calflow) placeCalbox();
  drawCursor();
  updateHud();
}

function polyline(pts, color, width = 2, closed = false, dash = []) {
  if (pts.length < 2) return;
  g.beginPath();
  pts.map(c).forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  if (closed) g.closePath();
  g.lineCap = g.lineJoin = 'round';
  g.setLineDash([]);
  g.strokeStyle = 'black'; g.lineWidth = width + 2; g.stroke();
  g.setLineDash(dash);
  g.strokeStyle = color; g.lineWidth = width; g.stroke();
  g.setLineDash([]);
}

function label(x, y, text, color, anchor = 'sw') {
  g.font = FONT;
  g.textBaseline = 'top';
  const w = g.measureText(text).width, h = 14;
  const left = anchor === 'sw' ? x : x - w / 2;
  const top = anchor === 'sw' ? y - h : anchor === 'n' ? y : y - h / 2;
  g.fillStyle = 'black';
  g.fillRect(left - 2, top - 1, w + 4, h + 2);
  g.fillStyle = color;
  g.fillText(text, left, top + 1);
}

function handle(p, color) {
  const [x, y] = c(p);
  g.fillStyle = color; g.fillRect(x - 3, y - 3, 7, 7);
  g.strokeStyle = 'black'; g.lineWidth = 1; g.strokeRect(x - 3.5, y - 3.5, 7, 7);
}

function endLabel(at, a, b, text, color) {
  const [x, y] = c(at), [ax, ay] = c(a), [bx, by] = c(b);
  const L = Math.max(Math.hypot(bx - ax, by - ay), 1e-9);
  label(x + 14 * (ay - by) / L, y + 14 * (bx - ax) / L, text, color, 'center');
}

function drawShape(s, color = null) {
  const k = s.kind, pts = s.pts;
  color = color || (s === S.sel ? COL.sel : k === 'axis' ? COL.axis : k === 'pt' ? COL.pt : COL.shape);
  const text = shortLabel(s);
  if (k === 'pt') {
    const [x, y] = c(pts[0]);
    for (const [w, col] of [[4, 'black'], [2, color]]) {
      g.beginPath(); g.moveTo(x - 5, y - 5); g.lineTo(x + 5, y + 5); g.moveTo(x - 5, y + 5); g.lineTo(x + 5, y - 5);
      g.strokeStyle = col; g.lineWidth = w; g.stroke();
    }
    label(x + 6, y - 4, text, color);
  } else if (k === 'circle') {
    const [cx, cy] = c(pts[0]), r = dist(pts[0], pts[1]) * V.z;
    for (const [w, col] of [[4, 'black'], [2, color]]) {
      g.beginPath(); g.arc(cx, cy, r, 0, 2 * Math.PI); g.strokeStyle = col; g.lineWidth = w; g.stroke();
    }
    polyline(pts, color, 1, false, [4, 3]);
    label(cx + 4, cy - 4, text, color);
  } else if (k === 'poly' && pts.length >= 3) {
    g.beginPath();
    pts.map(c).forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
    g.globalAlpha = 0.2; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
    polyline(pts, color, 2, true);
    const [cx, cy] = c([pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length]);
    label(cx, cy, text, color, 'center');
  } else if (k === 'angle' && pts.length === 3) {
    polyline(pts, color);
    const [vx, vy] = c(pts[1]), [start, extent] = angleExtent(pts);
    g.beginPath();
    g.arc(vx, vy, 48, -rad(start), -rad(start + extent), extent > 0);
    g.strokeStyle = color; g.lineWidth = 2; g.stroke();
    const mid = rad(start + extent / 2);
    label(vx + 84 * Math.cos(mid), vy - 84 * Math.sin(mid), text, color, 'center');
  } else {
    polyline(pts, color);
    const [ax, ay] = c(pts.at(-2)), [bx, by] = c(pts.at(-1));
    label((ax + bx) / 2 + 6, (ay + by) / 2 - 6, text, color);
  }
  if (s.cal && CAL_KINDS.includes(k)) {
    const v1 = k === 'axis' ? s.cal.v1 : alongValue(s, spanPx(s));
    endLabel(pts[0], pts[0], pts[1], fmt(s.cal.v0), color);
    endLabel(pts.at(-1), pts.at(-2), pts.at(-1), fmt(v1), color);
  }
  if (s === S.sel) pts.forEach(p => handle(p, color));
}

function drawCursor() {
  const [mx, my] = S.mouse;
  if (S.cross && S.mouseIn) {
    g.setLineDash([3, 5]); g.strokeStyle = COL.cross; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, my + 0.5); g.lineTo(W, my + 0.5); g.moveTo(mx + 0.5, 0); g.lineTo(mx + 0.5, H); g.stroke();
    g.setLineDash([]);
  }
  S.preview = S.cur ? { ...S.cur, pts: [...S.cur.pts, cursorPoint()] } : null;
  if (S.preview) drawShape(S.preview, COL.preview);
  if (S.calflow) {
    const [x, y] = c(calAnchor());
    for (const [w, col] of [[4, 'black'], [2, COL.sel]]) {
      g.beginPath(); g.arc(x, y, 9, 0, 2 * Math.PI); g.strokeStyle = col; g.lineWidth = w; g.stroke();
    }
  }
  S.hover = findHover();
  if (S.hover) {
    const h = S.hover, [fx, fy] = c(h.foot);
    if (h.shape.kind === 'circle') polyline([h.shape.pts[0], h.foot], COL.value, 1, false, [4, 3]);
    g.beginPath(); g.arc(fx, fy, 4, 0, 2 * Math.PI);
    g.fillStyle = COL.value; g.fill(); g.strokeStyle = 'black'; g.lineWidth = 1; g.stroke();
    label(fx + 8, fy - 8, h.text, COL.value);
  }
  drawHot();
  if (S.loupe && S.mouseIn && S.has) drawLoupe();
}

// what a pan-tool press would grab (or is dragging): [shape, point indices, isHandle] or null
function hotPart() {
  const d = S.drag;
  if (d && d.kind === 'handle') return [d.shape, [d.k], true];
  if (d && d.kind === 'move') return [d.shape, d.idx, false];
  if (d || S.tool !== 'pan' || S.calflow || !S.mouseIn) return null;
  const h = hitHandle(...S.mouse);
  if (h) return [h[0], [h[1]], true];
  const b = hitBody(...S.mouse);
  return b ? [b[0], b[1], false] : null;
}

function drawHot() {
  const hot = hotPart();
  if (!hot) return;
  const [s, idx, isHandle] = hot, pts = s.pts, n = pts.length;
  if (isHandle) {
    const [x, y] = c(pts[idx[0]]);
    for (const [w, col] of [[4, 'black'], [2, COL.hot]]) {
      g.beginPath(); g.arc(x, y, 7, 0, 2 * Math.PI); g.strokeStyle = col; g.lineWidth = w; g.stroke();
    }
    return;
  }
  if (s.kind === 'circle') {
    const [cx, cy] = c(pts[0]);
    g.beginPath(); g.arc(cx, cy, dist(pts[0], pts[1]) * V.z, 0, 2 * Math.PI);
    g.strokeStyle = COL.hot; g.lineWidth = 3; g.stroke();
    return;
  }
  const segs = [...Array(n - 1).keys()].map(i => [i, i + 1]).concat(s.kind === 'poly' ? [[n - 1, 0]] : []);
  segs.filter(([i, j]) => idx.includes(i) && idx.includes(j)).forEach(([i, j]) => polyline([pts[i], pts[j]], COL.hot, 3));
}

function drawLoupe() {
  const [mx, my] = S.mouse, [ix, iy] = im(mx, my);
  const half = LOUPE_N >> 1, size = LOUPE_N * LOUPE_MAG;
  const x0 = Math.floor(ix) - half, y0 = Math.floor(iy) - half;
  lctx.fillStyle = '#000';
  lctx.fillRect(0, 0, LOUPE_N, LOUPE_N);
  lctx.drawImage(src, -x0, -y0);
  const lx = mx + 30 + size < W ? mx + 30 : mx - 30 - size;
  const ly = my + 30 + size < H ? my + 30 : my - 30 - size;
  g.imageSmoothingEnabled = false;
  g.drawImage(loupeCanvas, lx, ly, size, size);
  g.strokeStyle = '#fff'; g.lineWidth = 1; g.strokeRect(lx - 0.5, ly - 0.5, size + 1, size + 1);
  const cx = lx + (ix - x0) * LOUPE_MAG, cy = ly + (iy - y0) * LOUPE_MAG;
  g.strokeStyle = COL.preview;
  g.beginPath(); g.moveTo(lx, cy); g.lineTo(lx + size, cy); g.moveTo(cx, ly); g.lineTo(cx, ly + size); g.stroke();
}

function pixelHex(p) {
  const x = Math.floor(p[0]), y = Math.floor(p[1]);
  if (!S.has || x < 0 || y < 0 || x >= src.width || y >= src.height) return null;
  const d = sctx.getImageData(x, y, 1, 1).data;
  return '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
}

// --------------------------------------------------------------------- HUD
function rich(rows, swatch = null) {
  return rows.map(([head, body, cls]) => `<span class="h">${esc(head.padEnd(7))}</span>` +
    body.split(/(\{[^}]*\}|§)/).map(part =>
      part.startsWith('{') ? `<kbd>${esc(part.slice(1, -1))}</kbd>`
        : part === '§' ? `<span class="sw" style="background:${swatch || 'transparent'}"></span>`
        : `<span class="${cls}">${esc(part)}</span>`).join('')).join('\n');
}

function hint() {
  if (S.tool !== 'digitize') return HINTS[S.tool];
  const [kind, axis] = nextKind();
  if (kind === 'axis') {
    const n = S.cur ? S.cur.pts.length + 1 : 1;
    return `click ${axis.toUpperCase()}-axis point ${n}/2 (at a known ${axis} value), then type values`;
  }
  if (axes().includes(null)) return 'axis not calibrated: select it (pan tool) and press {c}';
  return 'click to record a point · {Y} copies all points as CSV';
}

let lastInfo = '';
function updateHud() {
  const p = im(...S.mouse), px = pixelHex(p);
  const size = S.has ? `img ${src.width}×${src.height}${S.live ? ' ● LIVE' : ''}` : 'no image';
  const rows = [['cursor', `${f1(p[0]).padStart(8)} ${f1(p[1]).padStart(8)} px   § ${px || '-------'}   zoom ${fmt(V.z)}×   ${size}`, 'val']];
  const d = toData(p);
  if (d) rows.push(['data', `x=${fmt(d[0])}  y=${fmt(d[1])}`, 'val']);
  if (S.hover) rows.push(['on', `${name(S.hover.shape)}: ${S.hover.text}`, 'val']);
  if (S.preview) rows.push(['draw', `${S.preview.kind}  ${summary(S.preview)}`, 'val']);
  else if (S.shapes.includes(S.sel)) rows.push(['sel', `${name(S.sel)}  ${summary(S.sel)}`, 'val']);
  const sc = scale();
  if (sc) {
    const from = S.shapes.includes(S.scaleSrc) ? `${name(S.scaleSrc)}: ` : '';
    rows.push(['scale', `${from}1 px = ${fmt(sc[0])} ${sc[1]}`, 'val']);
  }
  rows.push(['tool', hint(), 'dim']);
  if (S.msg) rows.push(['', S.msg, 'msg']);
  const html = rich(rows, px);
  if (html !== lastInfo) $('#info').innerHTML = lastInfo = html;
  $('#livebtn').classList.toggle('on', S.live);
  $('#welcome').hidden = S.has;
}

function say(msg) { S.msg = msg; redraw(); }

function startCal(s) {
  if (![...CAL_KINDS, 'poly'].includes(s.kind)) return say('calibration applies to lines, paths, circles and areas');
  S.cur = null;
  S.calflow = { shape: s, steps: calSteps(s.kind), i: 0, answers: {}, prev: calPrevious(s) };
  showCalStep();
}

function calAnchor() {
  const { shape: s, steps, i } = S.calflow, pts = s.pts;
  if (s.kind === 'poly') return [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
  return steps[i][0] === 'v0' ? pts[0] : pts.at(-1);
}

function showCalStep(error = '') {
  const f = S.calflow, [key, prompt] = f.steps[f.i], prev = f.prev[key] || '';
  const last = f.i === f.steps.length - 1;
  $('#clabel').textContent = `${prompt}:` + (error ? `  ${error}` : '');
  $('#clabel').classList.toggle('err', !!error);
  $('#chint').textContent = [last ? 'Enter done' : 'Enter next', 'Esc cancel', ...(f.i > 0 ? ['⌫ back'] : [])].join(' · ');
  const input = $('#cinput');
  input.placeholder = ['v0', 'v1', 'area', 'unit'].includes(key) ? '' : prev || 'no';
  if (!error) input.value = '';
  $('#calbox').hidden = false;
  placeCalbox();
  input.focus();
  redraw();
}

function placeCalbox() {
  const [x, y] = c(calAnchor()), box = $('#calbox');
  box.classList.toggle('below', y < 110);
  Object.assign(box.style, { left: `${x}px`, top: `${y}px` });
}

function calEnter() {
  const f = S.calflow, key = f.steps[f.i][0], s = f.shape;
  let ans;
  try {
    ans = calAnswer(key, $('#cinput').value.trim(), f.answers, f.prev, s.kind, !!scale());
  } catch (err) {
    return showCalStep(err.message);
  }
  if (ans === null) {
    const wasRef = s === S.scaleSrc;
    clearCal(s);
    endCal();
    return say(`${name(s)}: calibration cleared` + (wasRef ? ' · image back to pixels' : ''));
  }
  f.answers[key] = ans;
  if (ans === KEEP) f.steps = f.steps.filter(st => st[0] !== 'unit');
  if (++f.i < f.steps.length) return showCalStep();
  finishCal(s, f.answers);
  endCal();
  say(`${name(s)}: ${summary(s)}`);
}

// apply dialogue answers; any non-axis calibration with a second value sets the image scale
function finishCal(s, a) {
  const u = a.unit || (S.scaleK ? S.scaleK[1] : '');
  if (s.kind === 'axis') {
    s.cal = { v0: a.v0, v1: a.v1, unit: a.unit, log: a.log, cw: false };
    return;
  }
  if (s.kind === 'poly') return setScale(s, a.area, u);
  const keep = a.v1 === KEEP;
  const dir = keep ? (s.cal ? s.cal.dir : 1) : Math.sign(a.v1 - a.v0);
  s.cal = { v0: a.v0, dir, cw: !!a.cw };
  if (!keep) setScale(s, Math.abs(a.v1 - a.v0), u);
}

function clearCal(s) {
  s.cal = null;
  if (s === S.scaleSrc) { S.scaleK = null; S.scaleSrc = null; }
}

function calBack() {
  if (S.calflow && S.calflow.i > 0) { S.calflow.i--; showCalStep(); }
}

function endCal() {
  S.calflow = null;
  $('#calbox').hidden = true;
  $('#cinput').blur();
  redraw();
}

// ------------------------------------------------------------------- tools
function setTool(tool) {
  S.cur = null;
  S.tool = tool;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  redraw();
}

function nextKind() {
  if (S.cur) return [S.cur.kind, S.cur.axis];
  if (S.tool !== 'digitize') return [S.tool, null];
  const have = new Set(S.shapes.filter(s => s.kind === 'axis').map(s => s.axis));
  const missing = ['x', 'y'].filter(a => !have.has(a));
  return missing.length ? ['axis', missing[0]] : ['pt', null];
}

function addPoint(p) {
  if (!S.cur) {
    const [kind, axis] = nextKind();
    S.cur = { kind, pts: [], cal: null, axis };
  }
  S.cur.pts.push(p);
  const need = NEED[S.cur.kind];
  if (need && S.cur.pts.length >= need) finish();
  redraw();
}

function finish() {
  const s = S.cur;
  S.cur = null;
  const minimum = NEED[s.kind] || (s.kind === 'poly' ? 3 : 2);
  if (s.pts.length < minimum) return say(`${s.kind} needs at least ${minimum} points`);
  S.shapes.push(s);
  S.sel = s;
  S.msg = '';
  if (s.kind === 'axis') startCal(s);
  redraw();
}

function remove(s) {
  if (s === S.scaleSrc) S.scaleSrc = null;
  S.shapes = S.shapes.filter(x => x !== s);
  if (S.sel === s) S.sel = null;
  redraw();
}

function cancel() { S.cur = null; redraw(); }

function escape() {
  if (S.cur) cancel();
  else if (S.sel) { S.sel = null; redraw(); }
  else if (S.tool !== 'pan') setTool('pan');
}

function enter() {
  if (S.cur && NEED[S.cur.kind] === 0) finish();
  else if (S.sel) startCal(S.sel);
}

function backspace() {
  if (S.cur) {
    S.cur.pts.pop();
    if (!S.cur.pts.length) S.cur = null;
    redraw();
  } else if (S.sel) remove(S.sel);
}

function undo() {
  if (S.cur) cancel();
  else if (S.shapes.length) remove(S.shapes.at(-1));
}

function zoomAt(x, y, f) {
  const z = Math.min(64, Math.max(0.05, V.z * f));
  f = z / V.z;
  V = { z, tx: x - (x - V.tx) * f, ty: y - (y - V.ty) * f };
  S.viewTouched = true;
  redraw();
}

function resetView() {
  if (S.has) {
    V.z = Math.min(1, W / src.width, H / src.height);
    V.tx = Math.round((W - src.width * V.z) / 2);
    V.ty = Math.round((H - src.height * V.z) / 2);
  }
  S.viewTouched = false;
  redraw();
}

// ------------------------------------------------------------------ output
async function copyText(text, what) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const oneLine = text.replace(/\n/g, ' ⏎ ');
  say(`copied ${what}: ${oneLine.length < 60 ? oneLine : oneLine.slice(0, 57) + '...'}`);
}

function copyReadout() {
  const p = im(...S.mouse), d = toData(p);
  if (S.hover) copyText(S.hover.copy, `${name(S.hover.shape)} readout`);
  else if (d && S.tool === 'digitize') copyText(`${fmt(d[0])}, ${fmt(d[1])}`, 'cursor data');
  else if (S.shapes.includes(S.sel)) copyText(`${name(S.sel)}: ${summary(S.sel)}`, name(S.sel));
  else copyText(`${f1(p[0])}, ${f1(p[1])}`, 'cursor px');
}

function pointsCsv() {
  const rows = S.shapes.filter(s => s.kind === 'pt').map(s => {
    const p = s.pts[0], d = toData(p) || [NaN, NaN];
    return `${fmt(d[0])},${fmt(d[1])},${p[0].toFixed(2)},${p[1].toFixed(2)}`;
  });
  return rows.length ? 'x,y,px,py\n' + rows.join('\n') + '\n' : '';
}

function copyPoints() {
  const csv = pointsCsv();
  if (!csv) return say('no digitized points yet (tool d)');
  copyText(csv, `${csv.trim().split('\n').length - 1} points as CSV`);
}

function report() {
  const lines = S.shapes.filter(s => s.kind !== 'pt').map(s => `${name(s)}: ${summary(s)}`);
  const csv = pointsCsv();
  return [...lines, ...(csv ? [csv.trimEnd()] : [])].join('\n');
}

function copyReport() {
  const text = report();
  if (!text) return say('nothing measured yet');
  copyText(text + '\n', 'report');
}

function savePng() {
  if (!S.has) return say('no image to save');
  const out = Object.assign(document.createElement('canvas'), { width: src.width, height: src.height });
  const saved = [g, V, S.sel];
  g = out.getContext('2d');
  V = { z: 1, tx: 0, ty: 0 };
  S.sel = null;
  g.drawImage(src, 0, 0);
  S.shapes.forEach(s => drawShape(s));
  [g, V, S.sel] = saved;
  out.toBlob(blob => {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: `pickleruler-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.png`,
    });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    say('saved annotated PNG');
  });
}

// ----------------------------------------------------------------- sources
function setImage(drawable, w, h, source) {
  const resized = w !== src.width || h !== src.height || !S.has;
  if (resized) { src.width = w; src.height = h; }
  sctx.drawImage(drawable, 0, 0, w, h);
  S.has = true;
  S.source = source;
  if (resized && !S.viewTouched) resetView();
  redraw();
}

async function loadBlob(blob, source) {
  try {
    const bmp = await createImageBitmap(blob);
    stopStream();
    setImage(bmp, bmp.width, bmp.height, source);
    say(`loaded ${source} (${bmp.width}×${bmp.height})`);
  } catch (err) {
    say(`could not load image: ${err.message}`);
  }
}

const nextFrame = () => new Promise(resolve => {
  const timer = setTimeout(resolve, 500);
  const done = () => { clearTimeout(timer); resolve(); };
  video.requestVideoFrameCallback ? video.requestVideoFrameCallback(done) : requestAnimationFrame(done);
});

function stopStream() {
  S.stream?.getTracks().forEach(t => t.stop());
  S.stream = null;
  S.live = false;
  video.srcObject = null;
}

async function capture(live) {
  if (!navigator.mediaDevices?.getDisplayMedia) return say('screen capture unavailable in this context');
  stopStream();
  const controller = window.CaptureController ? new CaptureController() : undefined;
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'window', cursor: 'never' }, audio: false,
      selfBrowserSurface: 'exclude', surfaceSwitching: 'include', controller,
    });
  } catch (err) {
    return say(`capture cancelled (${err.name})`);
  }
  try { controller?.setFocusBehavior('no-focus-change'); } catch { /* unsupported for this surface */ }
  video.srcObject = stream;
  await video.play();
  await nextFrame();
  await nextFrame();
  S.stream = stream;
  stream.getVideoTracks()[0].addEventListener('ended', () => {
    S.stream = null; S.live = false; video.srcObject = null;
    say('capture ended; last frame kept');
  });
  const label = stream.getVideoTracks()[0].getSettings().displaySurface || 'capture';
  setImage(video, video.videoWidth, video.videoHeight, label);
  if (!live) {
    stopStream();
    return say(`captured ${label} (${src.width}×${src.height})`);
  }
  S.live = true;
  say('live: frames update continuously · {f} freezes');
  const tick = () => {
    if (!S.live) return;
    if (video.videoWidth) setImage(video, video.videoWidth, video.videoHeight, label);
    requestAnimationFrame(tick);
  };
  tick();
}

function toggleLive() {
  if (S.live) { stopStream(); say('frozen'); } else capture(true);
}

// ------------------------------------------------------------------ events
function syncCursor() { cv.classList.toggle('nocursor', S.cross); }

function setMouse(e) {
  S.mouse = [e.clientX, e.clientY];
  S.shift = e.shiftKey;
}

cv.addEventListener('mousedown', e => {
  e.preventDefault();
  if (S.calflow) endCal();
  setMouse(e);
  if (e.button === 1) {
    S.drag = { kind: 'pan', x: e.clientX, y: e.clientY, t: [V.tx, V.ty], moved: false, select: false };
    return;
  }
  if (e.button === 2) return onRight(e);
  if (e.button !== 0) return;
  if (e.detail >= 2) return onDouble(e);
  S.press = [e.clientX, e.clientY];
  if (S.tool === 'pan') {
    const h = hitHandle(e.clientX, e.clientY), b = h ? null : hitBody(e.clientX, e.clientY);
    if (h) {
      S.sel = h[0];
      S.drag = { kind: 'handle', shape: h[0], k: h[1] };
    } else if (b) {
      S.sel = b[0];
      S.drag = { kind: 'move', shape: b[0], idx: b[1], start: im(e.clientX, e.clientY), orig: b[0].pts.slice() };
    } else {
      S.drag = { kind: 'pan', x: e.clientX, y: e.clientY, t: [V.tx, V.ty], moved: false, select: true };
    }
    return redraw();
  }
  addPoint(cursorPoint());
});

window.addEventListener('mousemove', e => {
  if (hudDrag) {
    const x = e.clientX - hudDrag[0], y = e.clientY - hudDrag[1];
    Object.assign($('#hud').style, { left: `${x}px`, top: `${y}px` });
    return;
  }
  if (e.target !== cv && !S.drag) return;
  setMouse(e);
  const d = S.drag;
  if (d && d.kind === 'pan') {
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    d.moved ||= Math.hypot(dx, dy) > 3;
    V.tx = d.t[0] + dx;
    V.ty = d.t[1] + dy;
    S.viewTouched = true;
  } else if (d && d.kind === 'handle') {
    const pts = d.shape.pts, k = d.k;
    pts[k] = snapped(im(e.clientX, e.clientY), k > 0 ? pts[k - 1] : pts[1]);
  } else if (d && d.kind === 'move') {
    const q = im(e.clientX, e.clientY), [sx, sy] = d.start;
    d.idx.forEach(k => { d.shape.pts[k] = [d.orig[k][0] + q[0] - sx, d.orig[k][1] + q[1] - sy]; });
  }
  redraw();
});

window.addEventListener('mouseup', e => {
  hudDrag = null;
  const d = S.drag;
  S.drag = null;
  if (d) {
    if (d.kind === 'pan' && d.select && !d.moved) S.sel = nearest(e.clientX, e.clientY);
    return redraw();
  }
  if (e.button === 0 && e.target === cv && S.cur && S.press
      && Math.hypot(e.clientX - S.press[0], e.clientY - S.press[1]) > 5) {
    setMouse(e);
    addPoint(cursorPoint());
  }
  S.press = null;
});

function onDouble(e) {
  if (S.cur && NEED[S.cur.kind] === 0) finish();
  else if (S.tool === 'pan') {
    const s = nearest(e.clientX, e.clientY);
    if (s) { S.sel = s; startCal(s); }
  } else {
    S.press = [e.clientX, e.clientY];
    addPoint(cursorPoint());
  }
}

function onRight(e) {
  if (S.cur) return NEED[S.cur.kind] === 0 ? finish() : cancel();
  const s = nearest(e.clientX, e.clientY);
  if (s) { S.sel = s; startCal(s); }
}

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mouseenter', () => { S.mouseIn = true; redraw(); });
cv.addEventListener('mouseleave', () => { S.mouseIn = false; redraw(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const px = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1);
  zoomAt(e.clientX, e.clientY, Math.pow(1.25, -Math.max(-300, Math.min(300, px)) / 100));
}, { passive: false });

const ACTIONS = {
  Escape: escape, Enter: enter, c: () => S.sel && startCal(S.sel),
  Delete: () => S.sel && remove(S.sel), Backspace: backspace, u: undo,
  y: copyReadout, Y: copyPoints, E: copyReport, P: savePng,
  m: () => { S.loupe = !S.loupe; redraw(); }, x: () => { S.cross = !S.cross; syncCursor(); redraw(); },
  h: () => { $('#hud').hidden = !$('#hud').hidden; }, '?': () => { $('#help').hidden = !$('#help').hidden; },
  r: resetView, '+': () => zoomAt(...S.mouse, 1.25), '=': () => zoomAt(...S.mouse, 1.25),
  '-': () => zoomAt(...S.mouse, 0.8), w: () => capture(false), f: toggleLive, i: () => $('#file').click(),
};
const TOOL_KEYS = Object.fromEntries(TOOLS.map(([t, k]) => [k, t]));

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const act = TOOL_KEYS[e.key] ? () => setTool(TOOL_KEYS[e.key]) : ACTIONS[e.key];
  if (act) { e.preventDefault(); act(); }
});

$('#cinput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); calEnter(); }
  if (e.key === 'Escape') { e.preventDefault(); endCal(); }
  if (e.key === 'Backspace' && !e.target.value) { e.preventDefault(); calBack(); }
});

window.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); loadBlob(item.getAsFile(), 'paste'); }
});
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
window.addEventListener('dragleave', () => document.body.classList.remove('dragover'));
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragover');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) loadBlob(f, f.name);
});
$('#file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadBlob(f, f.name);
  e.target.value = '';
});

let hudDrag = null;
$('#title').addEventListener('mousedown', e => {
  const r = $('#hud').getBoundingClientRect();
  hudDrag = [e.clientX - r.left, e.clientY - r.top];
  e.preventDefault();
});

const toolBar = $('#tools');
for (const [tool, key, text] of TOOLS) {
  const b = Object.assign(document.createElement('button'), { innerHTML: `<kbd>${key}</kbd> ${text}`, tabIndex: -1 });
  b.dataset.tool = tool;
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => setTool(tool));
  toolBar.append(b);
}
const calBtn = Object.assign(document.createElement('button'), { innerHTML: '<kbd>c</kbd> Calibrate', tabIndex: -1 });
calBtn.addEventListener('mousedown', e => e.preventDefault());
calBtn.addEventListener('click', () => (S.sel ? startCal(S.sel) : say('select a shape to calibrate (pan tool, click it)')));
$('#sources').append(calBtn);
const SOURCE_ACTIONS = { live: toggleLive, open: () => $('#file').click(),
                         report: copyReport, png: savePng };
document.querySelectorAll('#sources button').forEach(b => {
  b.tabIndex = -1;
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => SOURCE_ACTIONS[b.dataset.act]());
});
$('#version').textContent = VERSION;
$('#helptext').innerHTML = rich(HELP.map(([h, b]) => [h, b, 'dim']));
$('#nocap').hidden = !!navigator.mediaDevices?.getDisplayMedia;
$('#livebtn').disabled = !navigator.mediaDevices?.getDisplayMedia;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  if (!S.viewTouched) resetView();
  redraw();
}
window.addEventListener('resize', resize);
resize();
setTool('line');
syncCursor();

window.pickleruler = { S, get V() { return V; }, im, c, summary, shortLabel, scale, toData, report, setImage, startCal, hotPart,
                       calEnter, calBack, endCal, setTool, redraw, render };
</script>
</body>
</html>
