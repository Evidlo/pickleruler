<script>
(async () => {
  const P = window.pickleruler, S = P.S, out = [];
  const cv = document.querySelector('#cv');
  const dist2 = ([a, b]) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const check = (n, got, want, tol = 1e-6) => out.push(`${Math.abs(got - want) <= tol * Math.max(1, Math.abs(want)) ? 'ok  ' : 'FAIL'} ${n}: ${got}`);
  const same = (n, got, want) => out.push(`${got === want ? 'ok  ' : 'FAIL'} ${n}: ${JSON.stringify(got)}`);
  const img = Object.assign(document.createElement('canvas'), { width: 800, height: 600 });
  const x = img.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 800, 600); x.lineWidth = 2;
  x.strokeStyle = '#000'; x.beginPath(); x.moveTo(100, 500); x.lineTo(700, 500); x.moveTo(100, 500); x.lineTo(100, 100); x.stroke();
  x.strokeStyle = '#f00'; x.beginPath(); x.moveTo(100, 500); x.lineTo(700, 100); x.stroke();
  P.setImage(img, 800, 600, 'test');
  const ev = (type, p, o = {}) => { const [cx, cy] = P.c(p); cv.dispatchEvent(new MouseEvent(type, { clientX: cx, clientY: cy, bubbles: true, button: 0, detail: 1, ...o })); };
  const clicks = (...pts) => pts.forEach(p => { ev('mousedown', p); ev('mouseup', p); });
  const key = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
  const inp = document.querySelector('#cinput');
  const press = k => inp.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const values = (...answers) => answers.forEach(a => { inp.value = a; press('Enter'); });
  const hover = p => { ev('mouseenter', p); ev('mousemove', p); P.render(); return S.hover; };
  try {
    key('d');
    clicks([100, 500], [700, 500]); values('0', '10', '', '');
    clicks([100, 500], [100, 100]); values('1', '1000', '', 'yes');
    clicks([400, 300], [700, 100]);
    const d = P.toData([400, 300]);
    check('digitize x', d[0], 5); check('digitize log y', d[1], Math.sqrt(1000));
    same('axes do not set the image scale', P.scale(), null);
    key('l');
    ev('mousedown', [100, 550]); ev('mousemove', [700, 550]); ev('mouseup', [700, 550]);
    const line = S.shapes.at(-1);
    same('uncalibrated image reports px', P.shortLabel(line), '600.0 px');
    key('c'); values('0', '60', 'mm');
    check('line calibration sets image scale', P.scale()[0], 0.1);
    same('reference label', P.shortLabel(line), '60 mm (ref)');
    key('c'); values('5', '5');
    check('equal values rejected, still step 2', S.calflow.i, 1);
    check('calbox visible above point', document.querySelector('#calbox').hidden ? 0 : 1, 1);
    press('Escape');
    check('cancel keeps scale', P.scale()[0], 0.1);
    check('line hover value', +hover([250, 552]).copy, 15);
    same('hover shows units', S.hover.text, '15 mm');
    clicks([100, 580], [400, 580]);
    const line2 = S.shapes.at(-1);
    same('new shape gets units automatically', P.shortLabel(line2), '30 mm');
    key('c'); values('100', '');
    same('blank point 2 skips units and finishes', S.calflow, null);
    check('blank point 2 keeps scale', P.scale()[0], 0.1);
    same('reference unchanged', S.scaleSrc === line, true);
    check('offset line: start value + scaled distance', +hover([250, 582]).copy, 115);
    key('a'); clicks([200, 200], [300, 200], [300, 300]); ev('mousedown', [0, 0], { button: 2 });
    const poly = S.shapes.at(-1);
    same('area in image units', P.shortLabel(poly), '50 mm²');
    key('c'); values('50', 'cm²');
    check('area calibration sets scale', P.scale()[0], 0.1);
    same('other shapes follow the new scale', P.shortLabel(line), '60 cm');
    key('v'); ev('mousedown', [300, 300]); ev('mousemove', [300, 400]); ev('mouseup', [300, 400]);
    check('area poly pts moved', poly.pts[2][1], 400);
    check('scale holds after resizing the reference', P.scale()[0], 0.1);
    same('resized reference area', P.shortLabel(poly), '100 cm² (ref)');
    key('p'); clicks([500, 200], [400, 300], [500, 300]);
    out.push('angle: ' + P.summary(S.shapes.at(-1)));
    key('t'); clicks([150, 150], [250, 150], [250, 250]); key('Enter');
    key('c'); values('0', '1', '');
    check('path value', +hover([251, 200]).copy, 0.75);
    key('c'); values('');
    same('blank point 1 clears calibration', S.shapes.at(-1).cal, null);
    same('clearing the reference returns image to px', P.scale(), null);
    check('uncalibrated path distance px', +hover([251, 200]).copy, 150);
    key('c'); values('0', '1', '');
    key('o'); clicks([600, 300], [650, 300]); key('c'); values('0', '1', '', '');
    key('c'); values('0'); inp.value = ''; press('Backspace');
    check('backspace steps back', S.calflow.i, 0);
    check('value step placeholder is blank', inp.placeholder === '' ? 1 : 0, 1);
    press('Escape');
    const h = hover([600, 280]).copy.split(',');
    check('circle r value', +h[0], 0.4); check('circle angle', +h[1], 90);
    key('a'); clicks([420, 420], [460, 420], [460, 460]); ev('mousedown', [460, 460], { detail: 2 });
    check('poly double-click finish n', S.shapes.at(-1).pts.length, 3);
    key('v');
    const by = k => S.shapes.find(s => s.kind === k);
    const drag = (a, b) => { ev('mousedown', a); ev('mousemove', b); ev('mouseup', b); };
    hover([400, 550]);
    let hot = P.hotPart();
    check('hover line segment highlights it', hot[0] === by('line') && hot[1].join() === '0,1' && !hot[2] ? 1 : 0, 1);
    hover([700, 550]);
    hot = P.hotPart();
    check('hover endpoint highlights handle', hot[2] && hot[1][0] === 1 ? 1 : 0, 1);
    drag([400, 550], [400, 560]);
    check('drag line segment moves both ends', by('line').pts[0][1] + by('line').pts[1][1], 1120);
    const poly1 = by('poly');
    drag([280, 250], [290, 270]);
    check('drag inside area moves all: vertex', poly1.pts[0][0] + poly1.pts[0][1], 430);
    check('drag path segment: before', by('path').pts[0][1], 150);
    drag([200, 150], [200, 140]);
    check('drag path segment moves its two points', by('path').pts[0][1] + by('path').pts[1][1], 280);
    check('drag path segment leaves others', by('path').pts[2][1], 250);
    drag([600, 320], [620, 320]);
    check('drag inside circle moves centre', by('circle').pts[0][0], 620);
    check('drag inside circle keeps radius', dist2(by('circle').pts), 50);
    key('?');
    hover([600, 280]);
    out.push(P.report());
  } catch (e) { out.push('EXC ' + e.stack); }
  const pre = document.createElement('pre'); pre.id = 'results'; pre.textContent = out.join('\n'); pre.hidden = true;
  document.body.append(pre);
})();
</script>
